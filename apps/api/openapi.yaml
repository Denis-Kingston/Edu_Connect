openapi: 3.0.3
info:
  title: Edu_Connect API
  version: 1.0.0
  description: OpenAPI specification for the Edu_Connect backend (TSUAP scaffold)
servers:
  - url: http://localhost:4000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
        institutionId:
          type: string

    Institution:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
        type:
          type: string
        capacity:
          type: integer

    Application:
      type: object
      properties:
        id:
          type: string
        applicantId:
          type: string
        institutionId:
          type: string
        program:
          type: string
        status:
          type: string
        choices:
          type: array
          items:
            type: string

    Payment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
          format: float
        provider:
          type: string
        reference:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Get authenticated user info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized

  /api/institutions:
    get:
      summary: List institutions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of institutions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Institution'
    post:
      summary: Create institution (admin or university officer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Institution'
      responses:
        '201':
          description: Institution created

  /api/applications:
    get:
      summary: List applications (applicant-scoped)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Applications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
    post:
      summary: Submit a new application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institutionId:
                  type: string
                program:
                  type: string
                choices:
                  type: array
                  items:
                    type: string
              required: [institutionId, program, choices]
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Validation error

  /api/payments/initiate:
    post:
      summary: Initiate payment (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                provider:
                  type: string
                reference:
                  type: string
              required: [amount, provider, reference]
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /api/payments/webhook:
    post:
      summary: Payment provider webhook (idempotent, HMAC signed)
      parameters:
        - in: header
          name: x-webhook-signature
          schema:
            type: string
          required: true
          description: HMAC SHA256 signature of the raw request body using PAYMENT_WEBHOOK_SECRET
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Bad request or signature verification failed
        '409':
          description: Duplicate webhook (already processed)

tags:
  - name: auth
  - name: institutions
  - name: applications
  - name: payments
